<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>..::Cuenta::..</title>
    <link rel="stylesheet" href="style.-gestionCuentas.css">
</head>
<body>
    <h2>Registrar Nueva Cuenta</h2>
    <form method="POST" action="{% url 'registrar_cuenta' %}">
        {% csrf_token %}

        <label>Tipo Cuenta (Número):</label>
        <input type="number" name="txtTipoCuenta" required>
        <br><br>

        <label>Descripción:</label>
        <input type="text" name="txtDescripcion" required>
        <br><br>

        <label>Saldo Inicial:</label>
        <input type="number" step="0.01" name="txtSaldo" required>
        <br><br>

        <button type="submit">Guardar Cuenta</button>
    </form>

    <hr>

    <h1>Lista de Cuentas</h1>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Descripción</th>
                <th>Saldo</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for cuenta in cuentas %}
            <tr>
                <td>{{ cuenta.id }}</td>
                <td>{{ cuenta.descripcion }}</td>
                <td>{{ cuenta.saldo }}</td>
                <td>
                    <a href="{% url 'actualizar_cuenta' cuenta.id %}"
                    style="color: blue; text-decoration: none; font-weight: bold;">
                        editar
                    </a>
                    |
                    <a href="{% url 'eliminar_cuenta' cuenta.id %}"
                    onclick="return confirm('¿Estás seguro de que deseas eliminar esta cuenta?');"
                    style="color: red; text-decoration: none; font-weight: bold;">
                        eliminar
                    </a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4">No hay cuentas registradas.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
